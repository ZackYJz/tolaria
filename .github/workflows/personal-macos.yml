name: Personal macOS build

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - ".husky/**"
      - "AGENTS.md"
      - "docs/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096
  PERSONAL_VERSION: 9999.0.0
  TAURI_TARGET: aarch64-apple-darwin

jobs:
  build:
    name: Build Apple Silicon DMG
    if: github.repository == 'ZackYJz/tolaria'
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ env.TAURI_TARGET }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure personal build
        shell: bash
        run: |
          sed -i '' "s/^version = \".*\"/version = \"${PERSONAL_VERSION}\"/" src-tauri/Cargo.toml
          jq \
            --arg version "$PERSONAL_VERSION" \
            '.version = $version
             | .productName = "Tolaria Personal"
             | .identifier = "com.zackyjz.tolaria.personal"
             | .bundle.createUpdaterArtifacts = false' \
            src-tauri/tauri.conf.json > "$RUNNER_TEMP/personal-tauri.conf.json"

      - name: Build unsigned DMG
        run: >-
          pnpm tauri build
          --ci
          --no-sign
          --target "$TAURI_TARGET"
          --bundles dmg
          --config "$RUNNER_TEMP/personal-tauri.conf.json"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Tolaria-Personal-macOS-Apple-Silicon
          path: src-tauri/target/${{ env.TAURI_TARGET }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
